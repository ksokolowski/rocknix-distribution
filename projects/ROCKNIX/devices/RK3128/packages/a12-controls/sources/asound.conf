# Powkiddy A12: ALSA-only audio (PIPEWIRE_SUPPORT=no), test 39.
# dmix mixes all clients at the codec's 48 kHz S32_LE; softvol adds the
# "Master" volume control the RK312x codec lacks.
pcm.a12_dmix {
    type dmix
    ipc_key 3128
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        format S32_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}
pcm.a12_softvol {
    type softvol
    slave.pcm "a12_dmix"
    control {
        name "Master"
        card 0
    }
    min_dB -50.0
    max_dB 0.0
}
pcm.!default {
    type plug
    slave.pcm "a12_softvol"
}
ctl.!default {
    type hw
    card 0
}
