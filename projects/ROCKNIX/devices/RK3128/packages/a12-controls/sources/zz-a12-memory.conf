# The shared 16 MiB floor consumes too much of the A12's 256 MiB RAM.
# Keep 4 MiB for kernel allocations; do not reduce display CMA reservations.
# Sort after the shared memory.conf; numeric prefixes sort before it.
vm.min_free_kbytes=4096

# Watermark boosting makes kswapd reclaim extra memory after fragmentation
# events; on the A12 that compaction failed anyway (test 90).
vm.watermark_boost_factor=0
